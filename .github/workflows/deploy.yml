# Publica el frontend en GitHub Pages cada vez que hay cambios en main.
# URL: https://ponchy-k.github.io/Equipo-BoogieBomb-13-14/
# Requisito: Settings > Pages > Source = "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez; si llega otro push, se cancela el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # GitHub Pages no conoce las rutas de React Router: al recargar /admin
      # devolvería 404. Con una copia de index.html como 404.html, cualquier
      # ruta carga la app y el router muestra la página correcta.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
